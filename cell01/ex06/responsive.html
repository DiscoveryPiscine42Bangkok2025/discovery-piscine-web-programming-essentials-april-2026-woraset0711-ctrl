<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 06 - Responsive</title>
    <style>
        /* จัดให้หน้าเว็บไม่มีขอบขาวรอบๆ เพื่อให้ตารางคลุมพื้นที่ทั้งหมด */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
        }

        table {
            /* หัวใจของ Responsive: ใช้ 100% ทั้งกว้างและสูง */
            width: 100%;
            height: 100%;
            border-collapse: collapse; /* ให้เส้นขอบตารางชิดกัน */
        }

        td {
            border: 1px solid #000000;
            text-align: center;
            font-size: 2vw; /* ขนาดตัวอักษรจะใหญ่ขึ้น-เล็กลงตามขนาดจอด้วย */
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <td style="background-color: #009afa; width: 50%;">
                First cell - FuckyouSirikorn!
            </td>
            
            <td style="background-color: #ffffff; width: 50%;">
                Second cell - JiwMRL22.
            </td>
        </tr>
    </table>

</body>
</html>
