<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Explode this balloon</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        #balloon {
            width: 200px;
            height: 200px;
            background-color: red;
            border-radius: 50%; 
            cursor: pointer;
            transition: all 0.1s ease; 
        }
    </style>
</head>
<body>

    <div id="balloon"></div>

    <script src="balloon.js"></script>
</body>
</html>
